<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI人机协同对话业务管理平台</title>
    <script type="text/javascript">
      // GitHub Pages 不支持 SPA 客户端路由，直接访问二级路径会走到这个 404.html。
      // 这里把当前路径编码后重定向回站点根目录，index.html 中的脚本会还原真实路径。
      // 参考方案: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // 对应 base: '/ai-quality-inspection-platform/'

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
