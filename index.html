<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI人机协同对话业务管理平台</title>
    <script type="text/javascript">
      // 还原被 404.html 重定向携带的原始路径（?p=/xxx），配合 spa-github-pages 方案
      ;(function (l) {
        var pm = l.search.match(/[?&]p=([^&]+)/)
        if (pm) {
          var decoded = decodeURIComponent(pm[1]).replace(/~and~/g, '&')
          var qm = l.search.match(/[?&]q=([^&]+)/)
          var query = qm ? '?' + decodeURIComponent(qm[1]).replace(/~and~/g, '&') : ''
          window.history.replaceState(null, null, decoded + query + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
